<p>practice-code works!</p>

<form action="" class="container  border m-5 p-4 w-25">
    <div>
        <label for="" class="form-label">Search</label>
        <input type="text" class="form-control " (input)="search($event)">
    </div>
    <p *ngFor="let item of searchValue">{{item.name}}</p>

    <button type="button" (click)="add()">ADD</button>
    <p>{{id}}</p>
</form>


<table class="border">
    <thead>
        <tr>
            <th>id</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of getData(); let i = index">
            <td>{{item.id}}</td>
            <td>{{item.name}}</td>
        </tr>
    </tbody>
</table>


<nav aria-label="...">
  <ul class="pagination">
    <li class="page-item disabled">
      <a class="page-link"  tabindex="-1" aria-disabled="true" (click)="decrement()">Previous</a>
    </li>
    <li class="page-item" [class.active]="pageSize == 5"><a class="page-link" (click)="pageSizeMethod(5)">5</a></li>
    <li class="page-item" aria-current="page" [class.active]="pageSize == 10">
      <a class="page-link" (click)="pageSizeMethod(10)">10</a>
    </li>
    <li class="page-item" [class.active]="pageSize == 25"><a class="page-link" (click)="pageSizeMethod(25)">25</a></li>
    <li class="page-item">
      <a class="page-link" (click)="increment()">Next</a>
    </li>
  </ul>
</nav>
